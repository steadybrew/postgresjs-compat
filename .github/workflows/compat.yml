name: compat

on:
  workflow_dispatch:
    inputs:
      version:
        description: '@steadybrew/postgresjs version to test (default: npm latest)'
        required: false
      targets:
        description: 'Target names separated by spaces (default: all)'
        required: false

permissions: {}

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      migrate: ${{ steps.plan.outputs.migrate }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: node runner/plan.mjs >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.target }} (${{ matrix.variant }}${{ matrix.shard != '' && format(' {0}', matrix.shard) || '' }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.databases != ''
        env:
          DATABASES: ${{ matrix.databases }}
          PG_PACKAGES: ${{ matrix.packages }}
        run: bash scripts/setup-postgres.sh $DATABASES
      - env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.plan.outputs.version }}
          MIGRATE: ${{ needs.plan.outputs.migrate }}
          SHARD: ${{ matrix.shard }}
        run: node runner/run.mjs "$TARGET" "$VARIANT" "$VERSION" "$MIGRATE" out $SHARD
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-${{ matrix.target }}-${{ matrix.variant }}${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: out

  compare:
    name: Compare and commit results
    needs: [plan, run]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
      - id: compare
        continue-on-error: true
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MIGRATE: ${{ needs.plan.outputs.migrate }}
          RESULTS: ${{ runner.temp }}/results
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTIAL: ${{ inputs.targets != '' }}
        run: node runner/compare.mjs "$VERSION" "$MIGRATE" "$RESULTS" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.targets == ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git diff --cached --quiet && exit 0
          git commit -m "results: @steadybrew/postgresjs $VERSION"
          git pull --rebase --quiet origin main
          git push
      - if: steps.compare.outcome == 'failure'
        run: exit 1
