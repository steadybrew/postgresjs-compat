name: compat

on:
  workflow_dispatch:
    inputs:
      version:
        description: '@steadybrew/postgresjs version to test (default: npm latest)'
        required: false
      targets:
        description: 'Target names separated by spaces (default: all)'
        required: false

permissions: {}

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      migrate: ${{ steps.plan.outputs.migrate }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - id: plan
        env:
          VERSION: ${{ inputs.version }}
          TARGETS: ${{ inputs.targets }}
        run: node runner/plan.mjs >> "$GITHUB_OUTPUT"

  run:
    name: ${{ matrix.target }} (${{ matrix.variant }}${{ matrix.shard != '' && format(' {0}', matrix.shard) || '' }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
      - if: matrix.databases != ''
        env:
          DATABASES: ${{ matrix.databases }}
          PG_PACKAGES: ${{ matrix.packages }}
        run: bash scripts/setup-postgres.sh $DATABASES
      - env:
          TARGET: ${{ matrix.target }}
          VARIANT: ${{ matrix.variant }}
          VERSION: ${{ needs.plan.outputs.version }}
          MIGRATE: ${{ needs.plan.outputs.migrate }}
          SHARD: ${{ matrix.shard }}
        run: node runner/run.mjs "$TARGET" "$VARIANT" "$VERSION" "$MIGRATE" out $SHARD
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: result-${{ matrix.target }}-${{ matrix.variant }}${{ matrix.shard != '' && format('-{0}', matrix.shard) || '' }}
          path: out

  compare:
    name: Compare and commit results
    needs: [plan, run]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: result-*
          path: ${{ runner.temp }}/results
      - id: compare
        continue-on-error: true
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          MIGRATE: ${{ needs.plan.outputs.migrate }}
          RESULTS: ${{ runner.temp }}/results
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PARTIAL: ${{ inputs.targets != '' }}
        run: node runner/compare.mjs "$VERSION" "$MIGRATE" "$RESULTS" "$RUN_URL" >> "$GITHUB_STEP_SUMMARY"
      - if: inputs.targets == ''
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results
          git diff --cached --quiet && exit 0
          git commit -m "results: @steadybrew/postgresjs $VERSION"
          git pull --rebase --quiet origin main
          git push
      - if: steps.compare.outcome == 'failure'
        run: exit 1
